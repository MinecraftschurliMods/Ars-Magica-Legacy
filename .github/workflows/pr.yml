name: "Build PR"

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - ".github/**"
      - "src/main/resources/**"

jobs:
  build:
    uses: MinecraftschurliMods/.github/.github/workflows/build.yml@main
    with:
      java-version: 21
      upload-artifacts: true
      datagen-folder: src/main/generated/
